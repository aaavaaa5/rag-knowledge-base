server:
  port: 8080

spring:
  application:
    name: rag-kb-demo

  datasource:
    url: jdbc:mysql://localhost:3306/kbs?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      api-key: ollama
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text
      chat:
        options:
          model: qwen2.5:7b

  elasticsearch:
    uris: http://localhost:9201

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.rag.kb.demo: debug
